[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="assets/fonts/*OFL.txt,assets/ART_SOURCES.md,assets/ENGINE_LICENSES.txt,assets/icons/manifest.json,assets/audio/manifest.json,data/*.json"
exclude_filter="tests/*,.verification/*,docs/*,builds/*,*.log"
export_path="builds/web/index.html"
script_export_mode=2

[preset.0.options]
custom_template/debug="res://.verification/templates/web_nothreads_debug.zip"
custom_template/release="res://.verification/templates/web_nothreads_release.zip"
variant/extensions_support=false
variant/thread_support=false
html/canvas_resize_policy=2
html/custom_html_shell="res://site/game-shell.html"
html/focus_canvas_on_start=true
progressive_web_app/enabled=false

[preset.1]
name="Android"
platform="Android"
